name: Rename Kids Corner file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename bramble-s-kids-corner.html to kids.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv bramble-s-kids-corner.html kids.html
          git commit -m "Rename bramble-s-kids-corner.html to kids.html"
          git push
