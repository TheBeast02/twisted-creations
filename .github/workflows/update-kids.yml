name: Update Kids Corner page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace kids.html with updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv -f bramble-s-kids-corner.html kids.html
          git add -A
          git commit -m "Add Start with Book 1 shortcut under Book 2 in Kids Corner"
          git push
