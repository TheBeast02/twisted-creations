let mirrorMode='off',movieLog=[],recStroke=null,replaying=false,totalPts=0,dirty=false;const MAXPTS=20000;
const _snap=snap;snap=function(){dirty=true;_snap()};
const SIZES=[['Small',10],['Medium',18],['Big',30]];
SIZES.forEach(([n,v])=>{let b=document.createElement('button');b.className='iconBtn toolBtn szBtn';b.innerHTML='<b style="font-size:'+(8+v*.7)+'px">\u25CF</b><small>'+n+'</small>';b.onclick=()=>{size=v;document.querySelectorAll('.szBtn').forEach(q=>q.classList.remove('on'));b.classList.add('on');hint.textContent=n+' brush — nice choice!'};sizes.appendChild(b);if(v===size)b.classList.add('on')});
const sprayModesDef=[['solid','Solid'],['duo','2 Colors'],['rainbow','🌈 Rainbow']];sprayModesDef.forEach(([m,label])=>{let b=document.createElement('button');b.className='iconBtn toolBtn sprayModeBtn';b.innerHTML='<small>'+label+'</small>';b.onclick=()=>{sprayMode=m;document.querySelectorAll('.sprayModeBtn').forEach(q=>q.classList.remove('on'));b.classList.add('on');hint.textContent=m==='solid'?'Spray paint — one solid color!':m==='rainbow'?'Spray paint — rainbow colors that flow!':'Spray paint — two colors, inside and out!'};sprayModes.appendChild(b);if(m===sprayMode)b.classList.add('on')});
const dottyModesDef=[['solid','Solid'],['duo','2 Colors'],['rainbow','🌈 Rainbow']];dottyModesDef.forEach(([m,label])=>{let b=document.createElement('button');b.className='iconBtn toolBtn dottyModeBtn';b.innerHTML='<small>'+label+'</small>';b.onclick=()=>{dottyMode=m;document.querySelectorAll('.dottyModeBtn').forEach(q=>q.classList.remove('on'));b.classList.add('on');hint.textContent=m==='solid'?'Dotty brush — tap and drag to sprinkle dots!':m==='rainbow'?'Dotty brush — rainbow dots!':'Dotty brush — two-tone dots, inside and out!'};dottyModes.appendChild(b);if(m===dottyMode)b.classList.add('on')});
let mirrorBtn=document.createElement('button');mirrorBtn.className='iconBtn';mirrorBtn.id='mirrorBtn';
function paintMirrorBtn(){mirrorBtn.innerHTML='<b style="font-size:29px">'+(mirrorMode==='kalei'?'🌀':'🪞')+'</b><small>'+(mirrorMode==='off'?'Mirror: Off':mirrorMode==='mirror'?'Mirror':'Kaleido')+'</small>';mirrorBtn.classList.toggle('on',mirrorMode!=='off')}
mirrorBtn.onclick=()=>{if(replaying)return;mirrorMode=mirrorMode==='off'?'mirror':mirrorMode==='mirror'?'kalei':'off';paintMirrorBtn();hint.textContent=mirrorMode==='off'?'Mirror off — draw free!':mirrorMode==='mirror'?'Mirror on — every stroke flips across the middle!':'Kaleidoscope on — watch it spin!'};
paintMirrorBtn();tools.appendChild(mirrorBtn);
const _addSticker=addSticker;
addSticker=function(glyph,px,py){let el=_addSticker(glyph,px,py);dirty=true;if(!replaying)movieLog.push({k:'st',glyph:glyph,x:px,y:py,t:performance.now()});return el};
let replayRAF=0,replayOps=[],replayIdx=0,replayT0=0,artBackup=null,stickerBackup=[];
function buildOps(){let ops=[],prevT=null,adj=0;const pushT=t=>{adj=prevT===null?0:adj+Math.min(t-prevT,1200);prevT=t;return adj};for(const e of movieLog){if(e.k==='st')ops.push({type:'st',t:pushT(e.t),glyph:e.glyph,x:e.x,y:e.y});else if(e.k==='f')ops.push({type:'fl',t:pushT(e.t),x:e.x,y:e.y,color:e.color,mirror:e.mirror});else if(e.pts.length>1)ops.push({type:'sg',t:pushT(e.t),pts:e.pts,tool:e.tool,color:e.color,size:e.size,mirror:e.mirror})}if(adj>45000){let f=45000/adj;ops.forEach(o=>o.t*=f)}return ops}
function playOp(o){if(o.type==='fl'){let sc=color,sm=mirrorMode;color=o.color;mirrorMode=o.mirror;fillAt([o.x,o.y]);color=sc;mirrorMode=sm;return}if(o.type==='st'){_addSticker(o.glyph,o.x,o.y);let el=selectedSticker;if(el)el.animate([{transform:'translate(-50%,-50%) scale(0)'},{transform:'translate(-50%,-50%) scale(1.3)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:350});return}let st=tool,sc=color,ss=size,sm=mirrorMode,spm=sprayMode,dpm=dottyMode;tool=o.tool;color=o.color;size=o.size;mirrorMode=o.mirror;if(o.sprayMode)sprayMode=o.sprayMode;if(o.dottyMode)dottyMode=o.dottyMode;for(let i=1;i<o.pts.length;i++)stroke(o.pts[i-1],o.pts[i]);tool=st;color=sc;size=ss;mirrorMode=sm;sprayMode=spm;dottyMode=dpm}
function startReplay(){replaying=true;drawing=false;recStroke=null;artBackup=c.toDataURL();stickerBackup=[...document.querySelectorAll('.stickerObj')].map(el=>({glyph:el.querySelector('.glyph').textContent,left:el.style.left,top:el.style.top,scale:el.dataset.scale,rot:el.dataset.rot}));clearArt();clearStickers();replayOps=buildOps();replayIdx=0;replayT0=performance.now();movieBtn.innerHTML='\u23F9 Stop';hint.textContent='🎬 Watch your movie!';replayRAF=requestAnimationFrame(tickReplay)}
function tickReplay(){if(!replaying)return;let el=performance.now()-replayT0;while(replayIdx<replayOps.length&&replayOps[replayIdx].t<=el){try{playOp(replayOps[replayIdx])}catch(e){}replayIdx++}if(replayIdx>=replayOps.length){stopReplay();return}replayRAF=requestAnimationFrame(tickReplay)}
function rebuildStickers(list){list.forEach(d=>{_addSticker(d.glyph,parseFloat(d.left)/100*c.width,parseFloat(d.top)/100*c.height);let el=selectedSticker;if(!el)return;el.dataset.scale=d.scale||'1';el.dataset.rot=d.rot||'0';el.style.transform='translate(-50%,-50%) scale('+el.dataset.scale+') rotate('+el.dataset.rot+'deg)'})}
function stopReplay(){if(!replaying)return;replaying=false;cancelAnimationFrame(replayRAF);restore(artBackup);clearStickers();rebuildStickers(stickerBackup);movieBtn.innerHTML='\u25B6 Movie';hint.textContent='🎉 Ta-da! That was your movie!'}
movieBtn.onclick=()=>{if(replaying){stopReplay();return}if(!movieLog.length){hint.textContent='Draw something first, then press \u25B6 Movie!';return}startReplay()};
function saveState(){if(!dirty)return;dirty=false;try{localStorage.setItem('brambleArtV5',JSON.stringify({art:c.toDataURL(),base:bc.toDataURL(),stickers:[...document.querySelectorAll('.stickerObj')].map(el=>({glyph:el.querySelector('.glyph').textContent,left:el.style.left,top:el.style.top,scale:el.dataset.scale,rot:el.dataset.rot})),movie:movieLog,pts:totalPts}))}catch(e){}}
function loadState(){let s=null;try{s=JSON.parse(localStorage.getItem('brambleArtV5'))}catch(e){}if(!s||!s.art)return;let bi=new Image;bi.onload=()=>bx.drawImage(bi,0,0);bi.src=s.base;let ai=new Image;ai.onload=()=>{x.drawImage(ai,0,0)};ai.src=s.art;rebuildStickers(s.stickers||[]);movieLog=s.movie||[];totalPts=s.pts||0;basePage='restored';hint.textContent='Welcome back \u2014 your art was saved! 🎨'}
setInterval(saveState,20000);addEventListener('pagehide',saveState);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveState()});

// hint toast: pop in on every tip, then fade so it never blocks the art
let hintFadeT=null;
new MutationObserver(()=>{
  hint.style.transition='none';hint.style.opacity='1';
  clearTimeout(hintFadeT);
  hintFadeT=setTimeout(()=>{hint.style.transition='opacity .8s';hint.style.opacity='0';},2800);
}).observe(hint,{childList:true,characterData:true,subtree:true});
loadState();
</script></body></html>
